name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # The scripts and tests use only the Python standard library, so CI installs nothing
      # (avoids unpinned pip installs flagged by OpenSSF Scorecard "Pinned-Dependencies").

      - name: Syntax & Compilation check
        run: |
          python -m py_compile scripts/loophole_scanner.py scripts/setup_tools.py scripts/zap_web_scan.py

      - name: Test Tool Preflight Check
        run: |
          python scripts/setup_tools.py --check

      - name: Unit tests for scanner rules
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          python -m unittest discover -s tests -v

      - name: Test Loophole Scanner CLI
        run: |
          python scripts/loophole_scanner.py --help
          python scripts/loophole_scanner.py --list-rules
          python scripts/loophole_scanner.py --target . --format json
          python scripts/loophole_scanner.py --target . --format sarif --output results.sarif
          python -c "import json; json.load(open('results.sarif'))"

      - name: Self-scan gate (no High or Critical in production code)
        run: |
          python scripts/loophole_scanner.py --target . --fail-on high

      - name: Test ZAP Web Scan CLI
        run: |
          python scripts/zap_web_scan.py --help
