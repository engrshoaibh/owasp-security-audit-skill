name: Fuzz scanner

# Separate from CI: Atheris is optional and pinned with hashes. Main CI stays stdlib-only.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Atheris (60s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Atheris (pinned + hashes)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-fuzz.txt

      - name: Fuzz loophole_scanner for 60 seconds
        run: |
          python tests/fuzz_loophole_scanner.py -max_total_time=60
