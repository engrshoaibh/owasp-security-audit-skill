name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create on the selected branch and release, e.g. v0.1.0"
        required: true

permissions: read-all

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract notes for this version from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad tag: $TAG"; exit 1; }
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[0-9]/ { next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          # A manual run creates the tag on the commit it was started from; a tag push reuses the pushed tag.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file release-notes.md --target "$GITHUB_SHA"
